<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dish Explorer</title>



<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
```

</head>

<body>

```

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="#">
            Dish Explorer
        </a>

        <div>

            <a class="text-white text-decoration-none me-3" href="#">
                Home
            </a>

            <a class="text-white text-decoration-none me-3" href="#">
                Dishes
            </a>

            <a class="text-white text-decoration-none" href="#">
                About
            </a>

        </div>

    </div>

</nav>




<div class="container text-center my-5">

    <h1>
        Delicious Dishes
    </h1>

    <p class="text-muted">
        Find your favourite dishes and recipes
    </p>

</div>





<div class="container">

    <div id="output"
        class="row">

    </div>

</div>





<footer class="bg-dark text-white text-center mt-5 py-3">

    <p class="mb-0">
        &copy; 2026 Dish Explorer
    </p>

</footer>





<script>

    const display = document.getElementById("output");


    fetch("https://www.themealdb.com/api/json/v1/1/search.php?s=")

        .then(res => res.json())

        .then(result => {

            console.log(result);

            let dishes = result.meals;


            dishes.forEach(dish => {

                display.innerHTML += `

                    <div class="col-md-4 mb-4">

                        <div class="card h-100">

                            <img
                                src="${dish.strMealThumb}"
                                class="card-img-top"
                                alt="${dish.strMeal}"
                                style="height: 220px; object-fit: cover;"
                            >


                            <div class="card-body">

                                <h5 class="card-title">
                                    ${dish.strMeal}
                                </h5>

                                <p class="card-text text-muted">
                                    Category: ${dish.strCategory}
                                </p>

                                <p class="card-text text-muted">
                                    Area: ${dish.strArea}
                                </p>

                                <a
                                    href="details.html?id=${dish.idMeal}"
                                    class="btn btn-dark"
                                >
                                    See Details
                                </a>

                            </div>

                        </div>

                    </div>

                `;

            });

        })


        .catch(error => {

            console.log(error);

            display.innerHTML = `

                <h3 class="text-center text-danger">
                    Failed to load dishes
                </h3>

            `;

        });

</script>
```

</body>

</html>
